name: test

on: [push, pull_request, workflow_dispatch]

jobs:
  linux:
    name: linux-${{ matrix.runner }}-${{ matrix.stack }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        stack: [gtk3, gtk4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install ${{ matrix.stack }} + xvfb
        run: |
          sudo apt-get update
          if [ "${{ matrix.stack }}" = "gtk4" ]; then
            sudo apt-get install -y --no-install-recommends \
              libgtk-4-1 libwebkitgtk-6.0-4 libjavascriptcoregtk-6.0-1 xvfb xauth
          else
            sudo apt-get install -y --no-install-recommends \
              libgtk-3-0 libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 xvfb xauth
          fi
      - run: go build ./...
      - run: go vet ./...
      - name: Test (xvfb)
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a go test ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build ./...
      - run: go vet ./...
      # windows-latest ships the Edge WebView2 Runtime; the test opens a real
      # WebView2 window and exercises the JS<->Go bridge round trip.
      - name: Test
        timeout-minutes: 6
        env:
          WEBVIEW2_DEBUG: '1'
        run: go test -timeout 180s .
