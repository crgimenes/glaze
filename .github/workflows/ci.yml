name: test

on: [push, pull_request, workflow_dispatch]

jobs:
  linux:
    name: linux-${{ matrix.runner }}-${{ matrix.stack }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        stack: [gtk3, gtk4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install ${{ matrix.stack }} + xvfb
        run: |
          sudo apt-get update
          if [ "${{ matrix.stack }}" = "gtk4" ]; then
            sudo apt-get install -y --no-install-recommends \
              libgtk-4-1 libwebkitgtk-6.0-4 libjavascriptcoregtk-6.0-1 xvfb xauth
          else
            # libgtk-4-1 is installed alongside the GTK3 stack on purpose: a real
            # desktop usually has both GTK versions present, and glaze must NOT
            # pull GTK4 into the process when only the GTK3 webkit is available
            # (doing so corrupts the GObject type system and crashes gtk_init).
            sudo apt-get install -y --no-install-recommends \
              libgtk-3-0 libgtk-4-1 libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 xvfb xauth
          fi
      - run: go build ./...
      - run: go vet ./...
      # examples/ is a separate module (keeps the library's go.mod purego-only).
      - name: Build examples
        run: cd examples && go build ./...
      # Ubuntu 24.04 restricts unprivileged user namespaces by default, which
      # WebKitGTK's bubblewrap sandbox (used by the GTK4/webkitgtk-6.0 network
      # process) needs. Relax it so the WebProcess can launch under xvfb.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # No DISPLAY here, so the GUI tests must skip (not fail). This guards the
      # headless/GTK-less path that a plain `go test ./...` hits off CI.
      # -count=1 so this skip result is not cached and reused by the xvfb run.
      - name: Headless safety (GUI tests must skip)
        run: go test -count=1 ./...
      - name: Test (xvfb)
        timeout-minutes: 6
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        # -count=1 so the GUI tests actually run here instead of reusing the
        # cached skip from the headless step above. -timeout 150s so a wedged GTK
        # call (e.g. gtk_init blocking on a missing display/bus) fails fast with a
        # goroutine dump instead of running to go test's 10m default.
        run: xvfb-run -a go test -count=1 -timeout 150s ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Build examples
        run: cd examples && go build ./...
      - run: go test ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Build examples
        run: cd examples && go build ./...
      # windows-latest ships the Edge WebView2 Runtime; the test opens a real
      # WebView2 window and exercises the JS<->Go bridge round trip.
      - name: Test
        timeout-minutes: 5
        env:
          WEBVIEW2_DEBUG: '1'
        shell: pwsh
        run: |
          # Compile the tests first so the watchdog below times only the run, not
          # the (slower) Windows build.
          go test -c -o glaze_test.exe .
          # go test's own -timeout prints a goroutine dump, but a process wedged in
          # a modal COM / Win32 call (WebView2, a file dialog) can fail to actually
          # exit. Run it under an external hard watchdog (WaitForExit +
          # Stop-Process) so a hang fails the job fast and still prints stdout/stderr.
          $p = Start-Process -FilePath .\glaze_test.exe `
            -ArgumentList '-test.v','-test.timeout=180s' `
            -NoNewWindow -PassThru `
            -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $exited = $p.WaitForExit(210000)
          if (Test-Path out.txt) { Get-Content out.txt }
          if (Test-Path err.txt) { Get-Content err.txt }
          if (-not $exited) {
            Write-Host "::error::Windows test hung; force-killing after 210s"
            Stop-Process -Id $p.Id -Force
            exit 1
          }
          exit $p.ExitCode

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - name: Lint (every backend / GOOS)
        run: |
          for os in darwin linux windows; do
            echo "== GOOS=$os =="
            GOOS=$os $(go env GOPATH)/bin/golangci-lint run ./...
          done
      # examples/ is a separate module, so the root ./... above does not reach it.
      - name: Lint examples (every GOOS)
        run: |
          cd examples
          for os in darwin linux windows; do
            echo "== examples GOOS=$os =="
            GOOS=$os $(go env GOPATH)/bin/golangci-lint run ./...
          done
