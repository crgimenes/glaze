name: test

on: [push, pull_request, workflow_dispatch]

jobs:
  linux:
    name: linux-${{ matrix.runner }}-${{ matrix.stack }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        stack: [gtk3, gtk4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ${{ matrix.stack }} + xvfb
        run: |
          sudo apt-get update
          if [ "${{ matrix.stack }}" = "gtk4" ]; then
            sudo apt-get install -y --no-install-recommends \
              libgtk-4-1 libwebkitgtk-6.0-4 libjavascriptcoregtk-6.0-1 xvfb xauth
          else
            sudo apt-get install -y --no-install-recommends \
              libgtk-3-0 libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 xvfb xauth
          fi
      - run: go build ./...
      - run: go vet ./...
      # examples/ is a separate module (keeps the library's go.mod purego-only).
      - name: Build examples
        run: cd examples && go build ./...
      # Ubuntu 24.04 restricts unprivileged user namespaces by default, which
      # WebKitGTK's bubblewrap sandbox (used by the GTK4/webkitgtk-6.0 network
      # process) needs. Relax it so the WebProcess can launch under xvfb.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # No DISPLAY here, so the GUI tests must skip (not fail). This guards the
      # headless/GTK-less path that a plain `go test ./...` hits off CI.
      # -count=1 so this skip result is not cached and reused by the xvfb run.
      - name: Headless safety (GUI tests must skip)
        run: go test -count=1 ./...
      - name: Test (xvfb)
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        # -count=1 so the GUI tests actually run here instead of reusing the
        # cached skip from the headless step above.
        run: xvfb-run -a go test -count=1 ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Build examples
        run: cd examples && go build ./...
      - run: go test ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Build examples
        run: cd examples && go build ./...
      # windows-latest ships the Edge WebView2 Runtime; the test opens a real
      # WebView2 window and exercises the JS<->Go bridge round trip.
      - name: Test
        timeout-minutes: 6
        env:
          WEBVIEW2_DEBUG: '1'
        run: go test -timeout 180s .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Lint (every backend / GOOS)
        run: |
          for os in darwin linux windows; do
            echo "== GOOS=$os =="
            GOOS=$os $(go env GOPATH)/bin/golangci-lint run ./...
          done
